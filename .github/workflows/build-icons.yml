name: Build app icons
# rebuild: black-bleed-v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'logo-eschenbach-ii.svg'
      - '.github/workflows/build-icons.yml'

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create PNG icons with edge-to-edge black frame
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg
          from PIL import Image, ImageDraw
          from pathlib import Path

          cairosvg.svg2png(
              url='logo-eschenbach-ii.svg',
              write_to='icon-source.png',
              output_width=1024,
              output_height=1024
          )

          logo = Image.open('icon-source.png').convert('RGBA')

          # Schwarz reicht bis an jeden äussersten Pixel. Dadurch kann nach
          # der iPhone-Abrundung kein weisser Saum ausserhalb des Rahmens
          # sichtbar bleiben.
          canvas = Image.new('RGBA', (1024, 1024), (0, 0, 0, 255))
          draw = ImageDraw.Draw(canvas)
          inner_inset = 38
          inner_radius = 190
          draw.rounded_rectangle(
              (inner_inset, inner_inset, 1024-inner_inset-1, 1024-inner_inset-1),
              radius=inner_radius,
              fill=(255, 255, 255, 255)
          )

          # Das exakte Eschenbach-II-Logo bleibt unverändert und liegt auf
          # der weissen Innenfläche; der schwarze Aussenrand bleibt frei.
          canvas.alpha_composite(logo)

          src = canvas.convert('RGB')
          src.resize((180,180), Image.Resampling.LANCZOS).save('app-icon-180.png','PNG',optimize=True)
          src.resize((180,180), Image.Resampling.LANCZOS).save('apple-touch-icon.png','PNG',optimize=True)
          src.resize((192,192), Image.Resampling.LANCZOS).save('app-icon-192.png','PNG',optimize=True)
          src.resize((512,512), Image.Resampling.LANCZOS).save('app-icon-512.png','PNG',optimize=True)
          Path('icon-source.png').unlink()
          PY
      - name: Commit icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apple-touch-icon.png app-icon-180.png app-icon-192.png app-icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m 'Build app icons with edge-to-edge black frame'
          git push
