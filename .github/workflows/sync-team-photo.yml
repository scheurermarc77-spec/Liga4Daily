name: Sync official team photo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-team-photo.yml'

permissions:
  contents: write

jobs:
  sync-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official FC Eschenbach II team photo
        run: |
          python -m pip install --quiet requests beautifulsoup4 pillow
          python - <<'PY'
          import io, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageOps

          PAGE = 'https://fceschenbach.ch/aktive/2-mannschaft'
          headers = {'User-Agent':'Mozilla/5.0 (Liga4Daily team photo sync)'}
          html = requests.get(PAGE, headers=headers, timeout=30).text
          soup = BeautifulSoup(html, 'html.parser')

          urls=[]
          for img in soup.find_all('img'):
              values=[]
              for attr in ('src','data-src','data-lazy-src'):
                  if img.get(attr): values.append(img.get(attr))
              if img.get('srcset'):
                  parts=[x.strip().split(' ')[0] for x in img.get('srcset').split(',') if x.strip()]
                  values.extend(parts[-2:])
              for value in values:
                  u=urljoin(PAGE, value)
                  if u.startswith('http') and u not in urls:
                      urls.append(u)

          candidates=[]
          for u in urls:
              try:
                  r=requests.get(u, headers=headers, timeout=25)
                  r.raise_for_status()
                  im=Image.open(io.BytesIO(r.content))
                  w,h=im.size
                  area=w*h
                  landscape = w/h if h else 0
                  text=u.lower()
                  penalty=0.15 if any(k in text for k in ('logo','icon','sponsor','avatar','cropped')) else 1.0
                  bonus=2.0 if any(k in text for k in ('mannschaft','team','2-mannschaft','zweite')) else 1.0
                  shape=1.5 if landscape>=1.25 else 0.65
                  score=area*penalty*bonus*shape
                  candidates.append((score,w,h,u,r.content))
              except Exception:
                  pass

          if not candidates:
              raise SystemExit('No downloadable images found on official team page')

          candidates.sort(reverse=True, key=lambda x:x[0])
          print('Top image candidates:')
          for score,w,h,u,_ in candidates[:12]:
              print(f'{w}x{h} score={int(score)} {u}')

          # Prefer a substantial landscape image, otherwise the highest-scoring candidate.
          suitable=[c for c in candidates if c[1] >= 700 and c[2] >= 350 and c[1]/c[2] >= 1.2]
          chosen=suitable[0] if suitable else candidates[0]
          _,w,h,u,data=chosen
          im=Image.open(io.BytesIO(data)).convert('RGB')
          im=ImageOps.exif_transpose(im)
          if im.width > 1800:
              new_h=round(im.height*1800/im.width)
              im=im.resize((1800,new_h),Image.Resampling.LANCZOS)
          im.save('team-photo.jpg','JPEG',quality=88,optimize=True,progressive=True)
          Path('team-photo-source.txt').write_text(f'{PAGE}\n{u}\noriginal={w}x{h}\n',encoding='utf-8')
          print(f'Chosen team photo: {w}x{h} {u}')
          PY
      - name: Commit team photo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add team-photo.jpg team-photo-source.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Update official FC Eschenbach II team photo'
          git push
