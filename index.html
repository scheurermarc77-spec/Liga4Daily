<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4c400">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Liga 4 Daily – FC Eschenbach II</title>
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="icon" href="app-icon-192.png?v=3" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3" sizes="180x180">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <header class="hero">
    <button id="logoButton" class="brand-button" type="button" aria-label="Logo von FC Eschenbach II vergrössern">
      <img class="brand-logo" src="logo-eschenbach-ii.svg?v=9" alt="FC Eschenbach II">
    </button>
    <div>
      <div class="eyebrow">IFV · 5. Liga · Gruppe 4</div>
      <h1>Liga 4 Daily</h1>
      <p>Der aktuelle Überblick mit Fokus auf FC Eschenbach II</p>
    </div>
  </header>

  <div class="adminbar">
    <a class="update-button" href="https://github.com/scheurermarc77-spec/Liga4Daily/actions/workflows/daily-report.yml" target="_blank" rel="noopener">↻ Neue Recherche starten</a>
    <span>Nur der Administrator kann eine neue Recherche auslösen. Für alle anderen bleibt die Seite normal lesbar.</span>
  </div>

  <main id="app" class="wrap">
    <section class="status-card skeleton">Bericht wird geladen …</section>
  </main>

  <footer>
    <p>Liga 4 Daily · FC Eschenbach II</p>
  </footer>

  <div id="logoModal" class="image-modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Logo FC Eschenbach II">
    <button id="logoClose" class="image-modal-close" type="button" aria-label="Vergrösserte Ansicht schliessen">×</button>
    <img class="image-modal-img" src="logo-eschenbach-ii.svg?v=9" alt="FC Eschenbach II">
  </div>

  <div id="teamPhotoModal" class="image-modal team-photo-modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Mannschaftsbild FC Eschenbach II">
    <button id="teamPhotoClose" class="image-modal-close" type="button" aria-label="Mannschaftsbild schliessen">×</button>
    <img class="image-modal-img team-photo-modal-img" src="team-photo.jpg?v=2" alt="Mannschaft FC Eschenbach II">
  </div>

  <script src="app.js?v=9" defer></script>
</body>
</html>
